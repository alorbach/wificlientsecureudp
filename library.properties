name=WiFiClientSecureUdp
version=1.0.0
author=Andre Lorbach
maintainer=Andre Lorbach
sentence=Secure UDP client library for ESP32 with DTLS support using mbedTLS
paragraph=WiFiClientSecureUdp provides encrypted and authenticated UDP communication for ESP32 devices. It implements DTLS (Datagram Transport Layer Security) and supports multiple authentication methods including root CA certificates, client certificates, and pre-shared keys (PSK). The library inherits from WiFiClient and provides a familiar API for secure datagram transport, making it ideal for IoT applications requiring secure UDP communication.
